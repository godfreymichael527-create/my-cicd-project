version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
  pre_build:
    commands:
      - echo "Running security scans..."
      - echo "No vulnerabilities found (simulated)."
  build:
    commands:
      - echo "Building the app..."
      - echo "Build completed on $(date)"
  post_build:
    commands:
      - echo "Packaging artifact for CodeDeploy..."
      - ls -la

artifacts:
  files:
    - '**/*'
  base-directory: .